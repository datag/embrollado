name: CI

on:
  pull_request:
  push:
    # CI runs on every branch push, including main. (branches + branches-ignore are not
    # allowed together; before the fix the workflow failed registration on main pushes.)
    branches:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: End-to-end tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Bundle budget
        # The constitution caps the initial route at 250 KB gzipped JavaScript.
        run: node tools/check-bundle-size.mjs
